services:
  discord-bot:
    container_name: discord-bot
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/discord-bot/.env
    environment:
      DATABASE_URL: postgres://blood_bowl:blood_bowl@postgres:5432/blood_bowl
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: blood_bowl
      POSTGRES_USER: blood_bowl
      POSTGRES_PASSWORD: blood_bowl
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blood_bowl -d blood_bowl"]
      interval: 5s
      timeout: 5s
      retries: 5

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles: ["schemaspy"]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -t
      - /config/pgsql-count.properties
      - -host
      - postgres
      - -port
      - "5432"
      - -db
      - blood_bowl
      - -u
      - blood_bowl
      - -p
      - blood_bowl
      - -s
      - game_data
    volumes:
      - ./docs/schemaspy-output:/output
      - ./tools/db-diagram/pgsql-count.properties:/config/pgsql-count.properties:ro

volumes:
  postgres_data:
