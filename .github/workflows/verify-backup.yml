# Restores a production backup into a throwaway PostgreSQL and sanity-checks
# it, so a backup that cannot be restored is noticed. See
# docs/discord-bot/production-backups.md.
#
# Runs after every successful scheduled or manually dispatched run of the
# backup workflow (verifying the newest backup), on manual dispatch of this
# workflow (the newest backup, or a named one), and when called from another
# workflow with the required `backup-key` of the backup to verify.
# workflow_run does not fire for a backup taken by another workflow that
# calls the backup workflow (a called workflow runs under its caller's name),
# so such a caller calls this workflow itself with the new backup's key.
#
# A failed verification, when this workflow runs on its own, opens (or
# comments on) the "Production backup verification failed" issue, and a
# successful newest-backup one closes it; see
# docs/discord-bot/production-backups.md#alerts. A skipped verification (the
# backup run did not succeed) and a cancelled one do neither. A called
# verification raises and resolves nothing: the caller's failed run is the
# signal. The calling job must still grant `issues: write`, because a called
# workflow's jobs cannot have more permissions than their caller grants.
# The alert job's `if` condition matches this exact name; renaming it needs
# that updated.
name: Verify production backup

on:
  workflow_run:
    workflows: ['Backup production database']
    types: [completed]
  workflow_dispatch:
    inputs:
      backup-key:
        description: Storage key of the backup to verify (newest when empty)
        required: false
        default: ''
  workflow_call:
    inputs:
      backup-key:
        description: Storage key of the backup to verify
        required: true
        type: string

permissions:
  contents: read

# One verification at a time; a running one is never cancelled.
concurrency:
  group: verify-backup
  cancel-in-progress: false

env:
  # pg_restore must be at least the dump's major version. Keep this equal to
  # POSTGRES_CLIENT_MAJOR_VERSION in backup-production.yml and ci.yml's
  # migration-check job, and to the service container's image below.
  POSTGRES_CLIENT_MAJOR_VERSION: '18'

jobs:
  verify:
    # A failed or cancelled backup run has nothing new to verify. Only
    # workflow_run carries a backup run's conclusion. A called run reports
    # its caller's event, so this tests for workflow_run rather than
    # listing the events that always verify.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment holding only the bucket READ-ONLY token: this
    # job can never delete backups and never sees the database URL.
    environment: production-backup-verify
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # workflow_run always runs on the default branch, so this checks out
      # main: its migrations are what the backup is compared against. A
      # called run checks out its caller's commit (for a deploy, the commit
      # being deployed). A backup that lacks that commit's new migrations
      # still passes, since an older backup is fine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The runner image's preinstalled client is older than the dump, so
      # install the pinned major from the PostgreSQL apt repository and put
      # its binaries first on PATH.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${POSTGRES_CLIENT_MAJOR_VERSION}"
          echo "/usr/lib/postgresql/${POSTGRES_CLIENT_MAJOR_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Show pg_restore version
        run: pg_restore --version
      - name: Build backup-cli
        run: pnpm --filter "@blood-bowl-tracker/backup-cli..." run build
      # Fails early, naming the GitHub environment and every empty setting
      # the verification needs, so an unconfigured environment is not mistaken
      # for a CLI problem. Prints only names, never values.
      - name: Check required settings
        env:
          BACKUP_STORAGE_ENDPOINT: ${{ vars.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_BUCKET: ${{ vars.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_READ_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_READ_SECRET_ACCESS_KEY }}
        run: |
          environment=production-backup-verify
          missing=()
          [ -n "$BACKUP_STORAGE_ENDPOINT" ] || missing+=(vars.BACKUP_STORAGE_ENDPOINT)
          [ -n "$BACKUP_STORAGE_BUCKET" ] || missing+=(vars.BACKUP_STORAGE_BUCKET)
          [ -n "$BACKUP_STORAGE_ACCESS_KEY_ID" ] || missing+=(secrets.BACKUP_STORAGE_READ_ACCESS_KEY_ID)
          [ -n "$BACKUP_STORAGE_SECRET_ACCESS_KEY" ] || missing+=(secrets.BACKUP_STORAGE_READ_SECRET_ACCESS_KEY)
          fix="Fix it in Settings -> Environments -> ${environment} (see docs/discord-bot/production-backups.md)."
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "::error::Every required setting is empty (${missing[*]}): GitHub environment '${environment}' looks unconfigured. ${fix}"
            exit 1
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Required settings empty in GitHub environment '${environment}': ${missing[*]}. ${fix}"
            exit 1
          fi
      # Prints {key, restoredMigrations, tableRowCounts} as JSON (no secrets).
      # A failed restore or check exits non-zero and fails the run. The key
      # input is passed through the environment, never interpolated into the
      # script. It is empty on workflow_run (newest backup) and always set on
      # a called run.
      - name: Verify backup
        env:
          BACKUP_STORAGE_ENDPOINT: ${{ vars.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_BUCKET: ${{ vars.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_READ_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_READ_SECRET_ACCESS_KEY }}
          BACKUP_KEY: ${{ inputs.backup-key }}
        run: |
          node tools/backup-cli/dist/main.js verify \
            "postgresql://postgres:postgres@localhost:5432/postgres" \
            ${BACKUP_KEY:+"$BACKUP_KEY"}

  # Only when this workflow runs on its own: inside a called workflow,
  # github.workflow is the caller's name, and the caller's failed run is the
  # signal. github.event_name cannot tell the two apart, since a called run
  # reports its caller's event. failure() is false for a cancelled run, so
  # cancelling raises nothing.
  alert-on-failure:
    needs: verify
    if: failure() && github.workflow == 'Verify production backup'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/backup-alert.yml
    with:
      command: raise-alert
      kind: verify

  resolve-alert:
    needs: verify
    # Verifying a chosen older backup says nothing about the newest one, so
    # only a newest-backup verification (empty on workflow_run) resolves. A
    # called run always passes a key, and also reports its caller's workflow
    # name, so it never resolves even if the key were ever empty.
    if: >-
      needs.verify.result == 'success' && inputs.backup-key == '' &&
      github.workflow == 'Verify production backup'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/backup-alert.yml
    with:
      command: resolve-alert
      kind: verify
