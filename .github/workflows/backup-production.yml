# Backs up the production Neon database to a private Cloudflare R2 bucket and
# prunes backups past the retention window. See
# docs/discord-bot/production-backups.md.
#
# Runs daily on a schedule, on manual dispatch, and when called from another
# workflow, which waits for it and can read the created backup's key from
# the `backup-key` output. deploy.yml calls it before every deploy and then
# verifies that backup by key with verify-backup.yml.
#
# A failed scheduled or dispatched run opens (or comments on) the
# "Production backup failed" issue, and a successful one closes it; see
# docs/discord-bot/production-backups.md#alerts. A run called from another
# workflow raises and resolves nothing (the caller owns that failure), but
# the calling job must still grant `issues: write`: a called workflow's jobs
# cannot have more permissions than their caller grants. The calling job
# must also pass every secret declared under workflow_call by name, or this
# job sees it empty.
# The alert jobs' `if` conditions and verify-backup.yml's workflow_run
# trigger match this exact name; renaming it needs both updated.
name: Backup production database

on:
  schedule:
    # 03:17 UTC daily: a quiet hour for the guild, and off the top of the
    # hour, when GitHub's scheduler is busiest and most likely to delay runs.
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    # A caller must pass each of these by name (NAME: ${{ secrets.NAME }});
    # the values come from this job's production-backup environment. Required
    # only checks that the name was passed, not that it has a value: the
    # "Check required settings" step checks the values.
    secrets:
      PRODUCTION_DATABASE_URL:
        description: Neon direct connection string of the production database
        required: true
      BACKUP_STORAGE_WRITE_ACCESS_KEY_ID:
        description: Access key id of the bucket write token
        required: true
      BACKUP_STORAGE_WRITE_SECRET_ACCESS_KEY:
        description: Secret access key of the bucket write token
        required: true
    outputs:
      backup-key:
        description: Storage key of the backup this run created
        value: ${{ jobs.backup.outputs.backup-key }}

permissions:
  contents: read

# Serializes runs (a scheduled run and a dispatched one never overlap) but
# never cancels one mid-upload or mid-prune: a second run waits instead (one waiting run is kept; a third
# trigger replaces it).
concurrency:
  group: backup-production
  cancel-in-progress: false

env:
  # pg_dump must be at least the server's major version; a newer pg_dump
  # dumps an older server fine. Keep this >= the Neon project's major
  # (production runs PostgreSQL 18).
  POSTGRES_CLIENT_MAJOR_VERSION: '18'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment holding the database URL and the bucket WRITE
    # token; nothing else in the repo can read them.
    environment: production-backup
    outputs:
      backup-key: ${{ steps.create.outputs.backup-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The runner image's preinstalled client is older than Neon's server,
      # so install the pinned major from the PostgreSQL apt repository and put
      # its binaries first on PATH.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${POSTGRES_CLIENT_MAJOR_VERSION}"
          echo "/usr/lib/postgresql/${POSTGRES_CLIENT_MAJOR_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Show pg_dump version
        run: pg_dump --version
      - name: Build backup-cli
        run: pnpm --filter "@blood-bowl-tracker/backup-cli..." run build
      # Fails early, naming the GitHub environment and every empty setting
      # the backup needs (the database URL and the storage settings), so an
      # unconfigured environment is not mistaken for a CLI problem. Prints
      # only names, never values. The prune step below reads the same storage
      # values, so this one check covers both. When this run was called by
      # another workflow (github.workflow is then the caller's name) and a
      # secret is empty, it adds that the caller must pass the secrets by name.
      - name: Check required settings
        env:
          BACKUP_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_STORAGE_ENDPOINT: ${{ vars.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_BUCKET: ${{ vars.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_WRITE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_WRITE_SECRET_ACCESS_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          environment=production-backup
          missing=()
          [ -n "$BACKUP_DATABASE_URL" ] || missing+=(secrets.PRODUCTION_DATABASE_URL)
          [ -n "$BACKUP_STORAGE_ENDPOINT" ] || missing+=(vars.BACKUP_STORAGE_ENDPOINT)
          [ -n "$BACKUP_STORAGE_BUCKET" ] || missing+=(vars.BACKUP_STORAGE_BUCKET)
          [ -n "$BACKUP_STORAGE_ACCESS_KEY_ID" ] || missing+=(secrets.BACKUP_STORAGE_WRITE_ACCESS_KEY_ID)
          [ -n "$BACKUP_STORAGE_SECRET_ACCESS_KEY" ] || missing+=(secrets.BACKUP_STORAGE_WRITE_SECRET_ACCESS_KEY)
          [ "${#missing[@]}" -gt 0 ] || exit 0
          fix="Fix it in Settings -> Environments -> ${environment} (see docs/discord-bot/production-backups.md)."
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::error::Every required setting is empty (${missing[*]}): GitHub environment '${environment}' looks unconfigured. ${fix}"
          else
            echo "::error::Required settings empty in GitHub environment '${environment}': ${missing[*]}. ${fix}"
          fi
          if [ "$WORKFLOW_NAME" != 'Backup production database' ] && [[ " ${missing[*]} " == *" secrets."* ]]; then
            echo "::error::This run was called by workflow '${WORKFLOW_NAME}'. A called workflow sees its environment's secrets only when the calling job passes each one by name under 'secrets:'; check that job's secrets block (see docs/discord-bot/production-backups.md#calling-from-another-workflow)."
          fi
          exit 1
      # The CLI prints {key, sizeBytes, createdAt} as JSON on stdout (no
      # secrets). A failure exits non-zero, which fails this step and the
      # job, and the prune step below is then skipped.
      - name: Create backup
        id: create
        env:
          BACKUP_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_STORAGE_ENDPOINT: ${{ vars.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_BUCKET: ${{ vars.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_WRITE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_WRITE_SECRET_ACCESS_KEY }}
        run: |
          node tools/backup-cli/dist/main.js create > "$RUNNER_TEMP/create-result.json"
          cat "$RUNNER_TEMP/create-result.json"
          echo "backup-key=$(jq -er .key "$RUNNER_TEMP/create-result.json")" >> "$GITHUB_OUTPUT"
      - name: Prune expired backups
        env:
          BACKUP_STORAGE_ENDPOINT: ${{ vars.BACKUP_STORAGE_ENDPOINT }}
          BACKUP_STORAGE_BUCKET: ${{ vars.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_WRITE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_WRITE_SECRET_ACCESS_KEY }}
        run: node tools/backup-cli/dist/main.js prune

  # Only when this workflow runs on its own: inside a called workflow,
  # github.workflow is the caller's name. github.event_name cannot tell the
  # two apart, since a dispatched caller reports workflow_dispatch too.
  # failure() is false for a cancelled run, so cancelling raises nothing.
  alert-on-failure:
    needs: backup
    if: failure() && github.workflow == 'Backup production database'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/backup-alert.yml
    with:
      command: raise-alert
      kind: backup

  resolve-alert:
    needs: backup
    if: needs.backup.result == 'success' && github.workflow == 'Backup production database'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/backup-alert.yml
    with:
      command: resolve-alert
      kind: backup
