name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build discord-bot Docker image
        run: docker build -f apps/discord-bot/Dockerfile .

  schemaspy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # docker-compose.yml validates every service's env_file when the file
      # is loaded, even one not being started — apps/discord-bot/.env is
      # gitignored and absent on a clean checkout, so `docker compose`
      # commands below would fail before even reaching postgres. Its
      # contents don't matter here since the discord-bot service is never
      # started; only the file's existence does.
      - name: Create placeholder discord-bot .env
        run: cp apps/discord-bot/.env.example apps/discord-bot/.env
      - name: Start postgres
        run: docker compose up -d postgres
      - name: Wait for postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' postgres 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "postgres did not become healthy in time" >&2
          exit 1
      - name: Run migrations
        run: pnpm --filter @blood-bowl-tracker/db run db:migrate
        env:
          DATABASE_URL: postgres://blood_bowl:blood_bowl@localhost:5433/blood_bowl
      # SchemaSpy has no Dockerfile of its own (it's a prebuilt public
      # image), so what needs validating is that the image pulls and runs
      # successfully against this repo's actual schema and config — the
      # same command deploy-local and a developer would run.
      - name: Generate SchemaSpy diagram
        run: pnpm run db:diagram
      - name: Stop stack
        if: always()
        run: docker compose down

  gatekeeper:
    needs: [lint, typecheck, test, docker-build, schemaspy-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
