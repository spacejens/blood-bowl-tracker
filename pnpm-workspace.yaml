packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
allowBuilds:
  '@swc/core': true
  # Declined: native optional acceleration for ssh2's remote-Docker transport,
  # which testcontainers here never uses (local Docker only). Pure-JS ssh2
  # still works without it.
  cpu-features: false
  esbuild: true
  # Declined: protobufjs's postinstall only regenerates its own TypeScript
  # types from .proto sources for its own build; not needed to require it.
  protobufjs: false
  # Deliberately declined, not just unset: running puppeteer's postinstall
  # would download Chromium on every CI install. docs/download-tp/index.md
  # documents the one-off `pnpm exec puppeteer browsers install chrome` a
  # developer runs locally to actually use the tool.
  puppeteer: false
  # Declined: brought in transitively by testcontainers for remote-Docker SSH
  # support, which is unused here (local Docker only); pure-JS fallback works.
  ssh2: false
  unrs-resolver: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - undici@6.28.0 || 7.29.0
  - fast-uri@3.1.5
  - js-yaml@4.3.1
  - nanoid@3.3.18
overrides:
  '@discordjs/rest>undici': ^8.0.0
