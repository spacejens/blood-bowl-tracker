packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Deliberately declined, not just unset: running puppeteer's postinstall
  # would download Chromium on every CI install. docs/download-tp/index.md
  # documents the one-off `pnpm exec puppeteer browsers install chrome` a
  # developer runs locally to actually use the tool.
  puppeteer: false
  unrs-resolver: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - undici@6.28.0 || 7.29.0
  - fast-uri@3.1.5
  - js-yaml@4.3.1
  - nanoid@3.3.18
overrides:
  '@discordjs/rest>undici': ^8.0.0
