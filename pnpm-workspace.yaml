packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - undici@6.27.0
  - brace-expansion@1.1.16 || 5.0.7
  - fast-uri@3.1.4
overrides:
  '@discordjs/rest>undici': ^6.27.0
patchedDependencies:
  # Works around an upstream bug: 5.1.0's Rolldown-built .d.ts files use
  # extensionless relative specifiers, which fail under moduleResolution
  # nodenext (TS2305). The patch adds the missing .js extensions. Drop it once
  # a fixed release ships — https://github.com/eratio08/vitest-mock-extended/issues/997
  vitest-mock-extended@5.1.0: patches/vitest-mock-extended@5.1.0.patch
