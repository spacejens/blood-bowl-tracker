packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Deliberately declined, not just unset: running puppeteer's postinstall
  # would download Chromium on every CI install. docs/download-tp/index.md
  # documents the one-off `pnpm exec puppeteer browsers install chrome` a
  # developer runs locally to actually use the tool.
  puppeteer: false
  unrs-resolver: true
minimumReleaseAge: 1440
overrides:
  '@discordjs/rest>undici': ^6.27.0
patchedDependencies:
  # Works around an upstream bug: 5.1.0's Rolldown-built .d.ts files use
  # extensionless relative specifiers, which fail under moduleResolution
  # nodenext (TS2305). The patch adds the missing .js extensions. Drop it once
  # a fixed release ships — https://github.com/eratio08/vitest-mock-extended/issues/997
  vitest-mock-extended@5.1.0: patches/vitest-mock-extended@5.1.0.patch
